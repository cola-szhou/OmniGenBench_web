<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genomic Foundation Model Evolution</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. 核心修复：背景透明控制
           ========================================= */
        
        /* 强制页面根元素和主体完全透明 */
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 防止溢出滚动条 */
        }

        /* 确保所有容器也是透明的 */
        .container, .chart-container, svg {
            background-color: transparent !important;
        }

        /* =========================================
           2. 颜色变量定义
           ========================================= */
        :root {
            /* --- 默认 Light 模式变量 --- */
            
            /* 文字颜色 */
            --text-main: #2e3c50;
            --text-secondary: #555555;
            --axis-color: #2e3c50;
            --line-color: #999999;
            
            /* 按钮样式 (必须有背景色，否则也是透明的) */
            --btn-bg: #ffffff;
            --btn-text: #333333;
            --btn-border: #dddddd;
            --btn-hover-bg: #f5f5f5;
            --btn-active-bg: #4e6688;
            --btn-active-text: #ffffff;

            /* 气泡文字 */
            --label-inside: #ffffff;
            --label-outside: #2e3c50;

            /* Tooltip */
            --tooltip-bg: rgba(44, 62, 80, 0.95);
            --tooltip-text: #ffffff;
        }

        /* --- 深色模式适配 (Slate) --- */
        [data-md-color-scheme="slate"], 
        body.dark-mode {
            --text-main: #e3e3e3;
            --text-secondary: #aebbc9;
            --axis-color: #aebbc9;
            --line-color: #555555;

            /* Dark Mode 按钮 */
            --btn-bg: #1e2029;
            --btn-text: #e3e3e3;
            --btn-border: #444444;
            --btn-hover-bg: #2c2f3b;
            --btn-active-bg: #5c7aa6;
            --btn-active-text: #ffffff;

            /* Dark Mode 气泡文字 */
            --label-inside: #ffffff; 
            --label-outside: #e3e3e3; 
            --tooltip-bg: rgba(255, 255, 255, 0.9);
            --tooltip-text: #000000;
        }

        /* =========================================
           3. 通用样式
           ========================================= */
        
        body {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            /* 这里的背景色引用已经被上面的 !important 覆盖，保证安全 */
            color: var(--text-main);
            transition: color 0.3s ease; /* 只过渡文字颜色，不过渡背景防止闪烁 */
            color-scheme: light dark;
        }
        
        * {
            font-family: 'Roboto', sans-serif !important;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            border-radius: 0;
            padding: 20px 20px;
            box-shadow: none;
        }

        /* --- Controls & Legend --- */
        .controls, .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-circle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1); 
        }

        .legend-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
        }

        .control-btn {
            background-color: var(--btn-bg) !important; /* 确保按钮不透明 */
            color: var(--btn-text);
            border: 1px solid var(--btn-border);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background-color: var(--btn-hover-bg) !important;
            border-color: var(--axis-color);
        }

        .control-btn.active {
            color: var(--btn-active-text);
            border-color: var(--btn-active-bg);
            background-color: var(--btn-active-bg) !important;
            box-shadow: 0 2px 8px rgba(78, 102, 136, 0.2);
        }

        /* --- Chart --- */
        .chart-container {
            position: relative;
        }

        .bubble {
            stroke: transparent; /* 在透明背景下，描边设为透明或微弱的颜色 */
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }
        
        .bubble:hover {
            stroke: #fff;
            stroke-width: 3;
            filter: brightness(1.2);
        }

        .tooltip {
            position: absolute;
            background: var(--tooltip-bg) !important; /* 确保 tooltip 不透明 */
            color: var(--tooltip-text);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Axis Styles */
        .axis text {
            font-size: 14px;
            fill: var(--text-secondary);
        }
        .axis path,
        .axis line {
            stroke: var(--axis-color);
        }

        .axis-label {
            font-size: 16px;
            font-weight: 500;
            fill: var(--text-main);
        }

        /* Label Styles */
        .model-label {
            font-size: 14px;
            font-weight: 500;
            text-anchor: middle;
            pointer-events: all;
            cursor: move;
        }

        .model-label.label-inside {
            fill: var(--label-inside);
            font-weight: bold;
            text-shadow: 0px 0px 3px rgba(0,0,0,0.3);
        }

        .model-label.label-outside {
            fill: var(--label-outside);
            font-weight: 500;
        }

        /* Connecting Lines */
        .label-line {
            stroke: var(--line-color);
            stroke-width: 1;
            stroke-opacity: 0.5;
        }

        /* --- Zoom Controls --- */
        .zoom-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            background: var(--btn-bg) !important;
            border: 1px solid var(--btn-border);
            color: var(--btn-text);
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .zoom-btn:hover {
            background: var(--btn-hover-bg) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border-color: var(--axis-color);
        }
    </style>

    <!-- 
       关键修复：将 JS 放在 HEAD 中运行。
       在 body 渲染前就检测并设置好 data-attribute，避免样式闪烁。
    -->
    <script>
        (function() {
            // 辅助函数：应用主题属性
            function applyTheme(scheme) {
                // 1. 设置透明背景
                document.documentElement.style.backgroundColor = 'transparent';
                // 此时 body 可能还未存在，需做检查
                if (document.body) {
                    document.body.style.backgroundColor = 'transparent';
                }

                // 2. 设置 color-scheme，帮助浏览器正确渲染滚动条和默认组件
                const isDark = scheme === 'slate' || scheme === 'dark';
                document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

                // 3. 关键修复：设置 data-md-color-scheme 属性，以便 CSS 变量生效
                // MkDocs Material通常在 html 标签上设置此属性
                if (scheme) {
                    document.documentElement.setAttribute('data-md-color-scheme', scheme);
                    if (document.body) {
                        document.body.setAttribute('data-md-color-scheme', scheme);
                    }
                }
            }

            // 尝试同步主题
            function syncTheme() {
                try {
                    let foundScheme = null;

                    // 1. 尝试从父页面获取
                    if (window.parent && window.parent.document) {
                        const parentHtml = window.parent.document.documentElement;
                        const parentBody = window.parent.document.body;
                        foundScheme = parentHtml.getAttribute('data-md-color-scheme') || 
                                      (parentBody ? parentBody.getAttribute('data-md-color-scheme') : null);
                    }

                    // 2. 如果父页面没获取到，尝试 localStorage (同源情况下)
                    if (!foundScheme) {
                        try {
                            // 简单的 localStorage 遍历查找 MkDocs palette
                            for (let i = 0; i < localStorage.length; i++) {
                                const key = localStorage.key(i);
                                if (key && key.includes('__palette')) {
                                    const item = JSON.parse(localStorage.getItem(key));
                                    if (item && item.color && item.color.scheme) {
                                        foundScheme = item.color.scheme;
                                        break;
                                    }
                                }
                            }
                        } catch (e) {}
                    }

                    // 3. 如果还是没有，检查系统偏好
                    if (!foundScheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        foundScheme = 'slate';
                    }

                    // 应用找到的主题
                    if (foundScheme) {
                        applyTheme(foundScheme);
                    } else {
                        // 即使没找到主题，也要保证透明
                        applyTheme(null);
                    }

                    // 4. 设置监听器，处理父页面动态切换
                    if (window.parent && window.parent.document) {
                        const observer = new MutationObserver((mutations) => {
                            mutations.forEach((mutation) => {
                                if (mutation.type === "attributes" && mutation.attributeName === "data-md-color-scheme") {
                                    const newScheme = mutation.target.getAttribute('data-md-color-scheme');
                                    applyTheme(newScheme);
                                }
                            });
                        });
                        // 监听 parent html 变化
                        observer.observe(window.parent.document.documentElement, { attributes: true });
                        // 监听 parent body 变化 (备用)
                        if (window.parent.document.body) {
                            observer.observe(window.parent.document.body, { attributes: true });
                        }
                    }

                } catch (e) {
                    console.log("Theme sync fallback", e);
                    // 出错也保证透明
                    applyTheme(null);
                }
            }

            // 立即执行一次
            syncTheme();

            // 在 DOMContentLoaded 时再执行一次，确保 body 属性被正确设置
            document.addEventListener('DOMContentLoaded', syncTheme);

        })();
    </script>
</head>
<body>
<div class="container">
    <div class="controls"></div>
    <div class="legend"></div>

    <div class="chart-container">
        <div class="zoom-controls">
            <button class="zoom-btn" id="zoom-in">+</button>
            <button class="zoom-btn" id="zoom-out">–</button>
            <button class="zoom-btn" id="zoom-reset">⌂</button>
        </div>
        <svg id="bubbleChart"></svg>
    </div>

    <div class="tooltip" id="tooltip"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        // --- 1. DATA SETUP ---
        const modelToModalityMap = new Map([
            ["RNA-BERT", "RNA"], ["5UTR-FM", "UTR"], ["UTRlm-TE-EL", "UTR"], ["UTRlm-MRL", "UTR"],
            ["Caduceus", "DNA"], ["SpliceBERT", "DNA"], ["PlantRNA-FM", "RNA"], ["HyenaDNA-Large", "DNA"],
            ["CALM", "DNA"], ["3UTRBERT", "UTR"], ["ErnieRNA", "RNA"], ["RNAErnie", "RNA"],
            ["UTRbert-4mer", "UTR"], ["UTRbert-5mer", "UTR"], ["NT-V2-100M", "DNA"], ["NT-2.5B", "DNA"],
            ["NT-500M", "DNA"], ["NT-100M", "DNA"], ["RNA-MSM", "RNA"], ["DNA-FM", "DNA"],
            ["DNABERT", "DNA"], ['DNABERT-2', "DNA"], ["OmniGenome", "RNA"], ["MP-RNA", "RNA"],
            ["RINA", "RNA"], ["RINAlmo", "RNA"], ["Agro-NT-1B", "DNA"], ["Evo-2", "Multi-modal"],
            ["Evo-1", "Multi-modal"], ["GenomeOcean", "DNA"], ["AIDO.DNA", "DNA"], ["Generanno", "DNA"],
            ["BioFM", "DNA"], ["scLong", "RNA"], ["UKBioBERT", "DNA"], ["Gene42-B", "DNA"],
            ["Gene42-L", "DNA"], ["GENERator", "DNA"]
        ]);

        const rawData = [
            { model: "RNA-BERT", params: 0.5, date: "22 February 2022", source: "bioRxiv" },
            { model: "5UTR-FM", params: 1.23, date: "14 Oct 2023", source: "NMI" },
            { model: "Caduceus", params: 1.9, date: "05 March 2024", source: "arXiv" },
            { model: "SpliceBERT", params: 19, date: "11 April 2024", source: "bioRxiv" },
            { model: "PlantRNA-FM", params: 35, date: "09 December 2024", source: "Nature Machine Intelligence" },
            { model: "HyenaDNA-Large", params: 47, date: "15 November 2023", source: "arXiv" },
            { model: "CALM", params: 85.7, date: "19 December 2022.", source: "bioRxiv" },
            { model: "3UTRBERT", params: 86, date: "12 September 2023", source: "bioRxiv" },
            { model: "ErnieRNA", params: 86.7, date: "17 Mar 2024", source: "bioRxiv" },
            { model: "RNAErnie", params: 86.7, date: "13 May 2024", source: "bioRxiv" },
            { model: "NT-V2-100M", params: 100, date: "28 November 2024", source: "bioRxiv" },
            { model: "NT-2.5B", params: 2500, date: "28 November 2024", source: "bioRxiv" },
            { model: "NT-500M", params: 500, date: "28 November 2024", source: "bioRxiv" },
            { model: "RNA-MSM", params: 96, date: "11 January 2024", source: "bioRxiv" },
            { model: "DNABERT", params: 89, date: "23 June 2021", source: "Bioinformatics" },
            { model: "DNABERT-2", params: 117, date: "11 Apr 2024", source: "bioRxiv" },
            { model: "OmniGenome", params: 186, date: "15 July 2024", source: "arXiv" },
            { model: "MP-RNA", params: 186, date: "12 November 2024", source: "Findings of EMNLP" },
            { model: "RINA", params: 186, date: "09 April 2024", source: "bioRxiv" },
            { model: "RINAlmo", params: 651, date: "09 April 2024", source: "bioRxiv" },
            { model: "Agro-NT-1B", params: 985, date: "27 Oct 2023", source: "bioRxiv" },
            { model: "Evo-2", params: 40000, date: "19 February 2025", source: "bioRxiv" },
            { model: "GenomeOcean", params: 4000, date: "30 January 2025", source: "bioRxiv" },
            { model: "AIDO.DNA", params: 7000, date: "01 December 2024", source: "bioRxiv" },
            { model: "BioFM", params: 265, date: "1 April 2025", source: "bioRxiv" },
            { model: "scLong", params: 1000, date: "11 November 2024", source: "bioRxiv" },
            { model: "UKBioBERT", params: 110, date: "2 Mar 2025", source: "bioRxiv" },
            { model: "Gene42-L", params: 1100, date: "20 March 2025", source: "arXiv" },
            { model: "GENERator", params: 1200, date: "11 February 2025", source: "arXiv" },
            { model: "Evo-1", params: 7000, date: "27 February 2024", source: "Together AI blog" }
        ];

        const data = rawData.map(d => ({
            ...d,
            date: new Date(d.date),
            modality: modelToModalityMap.get(d.model) || 'Other'
        }));

        // --- 2. CONFIGURATION & SCALES ---
        const colorMap = {
            "RNA": "#e74c3c", "DNA": "#3498db", "Multi-modal": "#2ecc71",
            "UTR": "#f1c40f",
        };

        const margin = {top: 20, right: 40, bottom: 80, left: 80};
        const containerWidth = document.querySelector('.container').clientWidth || 1400;
        const width = Math.min(1400, containerWidth - 40) - margin.left - margin.right;
        const height = 700 - margin.top - margin.bottom;

        const svg = d3.select("#bubbleChart")
            .attr("width", "100%")
            .attr("height", height + margin.top + margin.bottom)
            .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // 时间轴范围缓冲
        const dateExtent = d3.extent(data, d => d.date);
        
        // 左侧缓冲: 最小日期往前推 3 个月
        const minDateBuffered = new Date(dateExtent[0]);
        minDateBuffered.setMonth(minDateBuffered.getMonth() - 3); 

        // 右侧缓冲: 最大日期往后推 6 个月
        const maxDateBuffered = new Date(dateExtent[1]);
        maxDateBuffered.setMonth(maxDateBuffered.getMonth() + 6); 

        const xScale = d3.scaleTime()
            .domain([minDateBuffered, maxDateBuffered]) 
            .range([0, width]);

        const yScale = d3.scaleLog()
            .domain([0.4, 110000]) 
            .range([height, 0]).nice();
        
        const sizeScale = d3.scaleSqrt()
            .domain([0, d3.max(data, d => d.params)])
            .range([5, 55]); 

        // --- 3. CONTROLS ---
        const modalities = ["Show All", ...Object.keys(colorMap)];

        d3.select('.controls').selectAll('button')
            .data(modalities).enter()
            .append('button')
            .attr('class', 'control-btn')
            .classed('active', d => d === 'Show All')
            .text(d => d === 'Multi-modal' ? 'Multi' : d)
            .on('click', (event, d) => filterByModality(d));

        const legend = d3.select('.legend').selectAll('.legend-item')
            .data(Object.entries(colorMap)).enter()
            .append('div').attr('class', 'legend-item');

        legend.append('div').attr('class', 'legend-circle')
            .style('background-color', d => d[1]);
        legend.append('span').attr('class', 'legend-text')
            .text(d => d[0] === 'Multi-modal' ? 'Multi' : d[0]);

        // --- 4. LABEL LOGIC ---
        const labelDisplayInfo = new Map();
        const finalLabelPositions = new Map();
        const yAxisBinSize = 1;
        const paramGroups = d3.group(data, d => Math.round(yScale(d.params) / yAxisBinSize));

        paramGroups.forEach((group) => {
            group.sort((a, b) => a.date - b.date);
            const representative = group[0];
            labelDisplayInfo.set(representative.model, { show: true, intendedPos: 'outside' });
            for (let i = 1; i < group.length; i++) {
                labelDisplayInfo.set(group[i].model, { show: true });
            }
        });

        // --- 5. AXES ---
        const yAxisFormatter = d => {
            const exponent = Math.log10(d);
            if (Math.abs(exponent - Math.round(exponent)) < 1e-9) {
                return `10^${Math.round(exponent)}`;
            }
            return "";
        };

        const xAxis = g.append("g")
            .attr("class", "axis")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(xScale)
                .ticks(d3.timeYear.every(1))       
                .tickFormat(d3.timeFormat("%Y"))   
            );

        const yAxis = g.append("g")
            .attr("class", "axis")
            .call(d3.axisLeft(yScale)
                .ticks(10, d3.format(",.1s"))
                .tickFormat(yAxisFormatter)
            );

        g.append("text")
            .attr("class", "axis-label")
            .attr("transform", `translate(${width / 2},${height + 60})`)
            .style("text-anchor", "middle")
            .text("Release Date");

        g.append("text")
            .attr("class", "axis-label")
            .attr("transform", "rotate(-90)")
            .attr("y", -margin.left + 30)
            .attr("x", -height / 2)
            .style("text-anchor", "middle")
            .text("Model Parameters (Millions)");

        // --- 6. DRAW ELEMENTS ---
        const tooltip = d3.select("#tooltip");

        const bubbles = g.selectAll(".bubble")
            .data(data, d => d.model)
            .enter().append("circle")
            .attr("class", "bubble")
            .attr("cx", d => xScale(d.date))
            .attr("cy", d => yScale(d.params))
            .attr("r", 0)
            .attr("fill", d => colorMap[d.modality])
            .on("mouseover", (event, d) => {
                tooltip.style("opacity", 1)
                    .html(`<strong>${d.model}</strong><br/>
                           Model Parameters: ${d.params.toLocaleString()} M<br/>
                           Modality: ${d.modality}<br/>
                           Date: ${d.date.toLocaleDateString()}`);
            })
            // Tooltip smart positioning
            .on("mousemove", (event) => {
                const tooltipNode = tooltip.node();
                const tooltipRect = tooltipNode.getBoundingClientRect();
                const windowWidth = window.innerWidth;
                
                let leftPosition = event.pageX + 15;
                let topPosition = event.pageY - 10;
                
                if (leftPosition + tooltipRect.width > windowWidth - 20) {
                    leftPosition = event.pageX - tooltipRect.width - 15;
                }

                tooltip.style("left", leftPosition + "px")
                       .style("top", topPosition + "px");
            })
            .on("mouseout", () => tooltip.style("opacity", 0));

        // Connecting lines
        const lines = g.selectAll(".label-line")
            .data(data.filter(d => {
                const info = labelDisplayInfo.get(d.model);
                return info && info.show;
            }), d => d.model)
            .enter().append("line")
            .attr("class", "label-line")
            .attr("x1", d => xScale(d.date))
            .attr("y1", d => yScale(d.params))
            .attr("x2", d => xScale(d.date)) 
            .attr("y2", d => yScale(d.params));

        // Labels
        const labels = g.selectAll(".model-label")
            .data(data, d => d.model)
            .enter().append("text")
            .attr("class", "model-label")
            .attr("x", d => xScale(d.date))
            .attr("y", d => yScale(d.params))
            .text(d => d.model);

        // Drag Behavior
        const labelDrag = d3.drag()
            .on("start", function (event, d) {
                d3.select(this).raise().classed("dragging", true);
            })
            .on("drag", function (event, d) {
                d.customX = event.x;
                d.customY = event.y;
                
                d3.select(this).attr("x", d.customX).attr("y", d.customY);
                lines.filter(l => l.model === d.model)
                     .attr("x2", d.customX).attr("y2", d.customY);
            })
            .on("end", function () {
                d3.select(this).classed("dragging", false);
            });

        // Initialize Label Positions & Styles
        labels.each(function (d) {
            const node = d3.select(this);
            const info = labelDisplayInfo.get(d.model);

            if (!info || !info.show) {
                node.style("display", "none");
                return;
            }

            let finalPos = info.intendedPos;
            if (info.intendedPos === 'inside') {
                const textWidth = this.getBBox().width;
                const bubbleDiameter = sizeScale(d.params) * 2;
                if (textWidth > bubbleDiameter * 0.9) {
                    finalPos = 'outside';
                }
            }
            finalLabelPositions.set(d.model, finalPos);

            let x = xScale(d.date);
            let y = yScale(d.params);

            if (finalPos === 'inside') {
                node.attr("dy", "0.35em")
                    .classed("label-inside", true)
                    .classed("label-outside", false);
            } else {
                y = y - sizeScale(d.params) - 5;
                node.attr("dy", null)
                    .classed("label-inside", false)
                    .classed("label-outside", true);
            }

            d.customX = x;
            d.customY = y;
            node.attr("x", d.customX).attr("y", d.customY);

            lines.filter(l => l.model === d.model)
                 .attr("x2", d.customX).attr("y2", d.customY);

            node.call(labelDrag);
        });

        // Bubble Animation
        bubbles.transition()
            .duration(800)
            .delay((d, i) => i * 10)
            .attr("r", d => sizeScale(d.params))
            .ease(d3.easeElastic.period(0.6));

        // --- 7. ZOOM BEHAVIOR ---
        const zoom = d3.zoom()
            .scaleExtent([0.5, 20])
            .extent([[0, 0], [width, height]])
            .on("zoom", zoomed);

        function zoomed(event) {
            const newXScale = event.transform.rescaleX(xScale);
            const newYScale = event.transform.rescaleY(yScale);

            xAxis.call(d3.axisBottom(newXScale)
                .ticks(d3.timeYear.every(1))
                .tickFormat(d3.timeFormat("%Y"))
            );
            
            yAxis.call(d3.axisLeft(newYScale)
                .ticks(10, d3.format(",.1s"))
                .tickFormat(yAxisFormatter)
            );

            bubbles.attr("cx", d => newXScale(d.date))
                   .attr("cy", d => newYScale(d.params));

            lines.attr("x1", d => newXScale(d.date))
                 .attr("y1", d => newYScale(d.params));

            labels.each(function(d) {
                const node = d3.select(this);
                
                if (d.customX !== undefined && d.customY !== undefined) {
                    const transformedX = event.transform.applyX(d.customX);
                    const transformedY = event.transform.applyY(d.customY);
                    
                    node.attr("x", transformedX).attr("y", transformedY);
                    lines.filter(l => l.model === d.model)
                         .attr("x2", transformedX).attr("y2", transformedY);
                } else {
                    const finalPos = finalLabelPositions.get(d.model);
                    let x = newXScale(d.date);
                    let y = newYScale(d.params);

                    if (finalPos === 'outside') {
                        y = y - sizeScale(d.params) * Math.sqrt(event.transform.k) - 5;
                    }

                    node.attr("x", x).attr("y", y);
                    lines.filter(l => l.model === d.model)
                         .attr("x2", x).attr("y2", y);
                }
            });
        }

        svg.call(zoom);

        d3.select("#zoom-in").on("click", () => svg.transition().call(zoom.scaleBy, 1.3));
        d3.select("#zoom-out").on("click", () => svg.transition().call(zoom.scaleBy, 1 / 1.3));
        d3.select("#zoom-reset").on("click", () => svg.transition().call(zoom.transform, d3.zoomIdentity));

        function filterByModality(modality) {
            const isShowAll = modality === "Show All";

            bubbles.transition().duration(300)
                .style("opacity", d => isShowAll || d.modality === modality ? 1 : 0.1)
                .attr("r", d => isShowAll || d.modality === modality ? sizeScale(d.params) : sizeScale(d.params) / 2);

            labels.transition().duration(300)
                .style("opacity", d => {
                    if (!isShowAll && d.modality !== modality) return 0;
                    const info = labelDisplayInfo.get(d.model);
                    return (info && info.show) ? 1 : 0;
                });

            lines.transition().duration(300)
                .style("opacity", d => {
                    if (!isShowAll && d.modality !== modality) return 0;
                    const info = labelDisplayInfo.get(d.model);
                    return (info && info.show) ? 1 : 0;
                });

            d3.selectAll(".control-btn").classed("active", d => d === modality);
        }
    });
</script>
</body>
</html>
